<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Developer | Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        /* Dark & Modern Color Palette */
        --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        --glass-bg: rgba(30, 41, 59, 0.7); /* Koyu, şeffaf arka plan */
        --glass-border: rgba(255, 255, 255, 0.08);
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --accent-color: #38bdf8; /* Soft Cyan - Karanlıkta güzel parlar */
        --shadow-soft: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Outfit", sans-serif;
        background: var(--bg-gradient);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
        color: var(--text-main);
      }

      /* Glowing Blobs (Dark Mode Glow) */
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        z-index: 0;
        opacity: 0.4; /* Gözü yormaması için opacity düşük */
        animation: float 10s infinite ease-in-out;
      }

      .blob-1 {
        top: -10%;
        left: -10%;
        width: 500px;
        height: 500px;
        background: #3b82f6; /* Mavi Glow */
        animation-delay: 0s;
      }

      .blob-2 {
        bottom: -10%;
        right: -10%;
        width: 450px;
        height: 450px;
        background: #8b5cf6; /* Mor Glow */
        animation-delay: 2s;
      }

      /* Main Card Container */
      .container {
        position: relative;
        z-index: 1;
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 4rem 3rem;
        text-align: center;
        box-shadow: var(--shadow-soft);
        max-width: 480px;
        width: 90%; /* Mobilde ekranın %90'ını kaplar */
        transform: translateY(30px);
        opacity: 0;
        transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .container.visible {
        transform: translateY(0);
        opacity: 1;
      }

      /* Typography */
      h1 {
        font-size: 3rem;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 0.5rem;
        letter-spacing: -0.5px;
        line-height: 1.1;
      }

      .subtitle {
        font-size: 1.1rem;
        color: var(--text-muted);
        font-weight: 300;
        margin-bottom: 2.5rem;
      }

      .badge {
        display: inline-block;
        padding: 0.5rem 1rem;
        background: rgba(56, 189, 248, 0.1); /* Accent renginin %10 opasitesi */
        color: var(--accent-color);
        border-radius: 50px;
        font-size: 0.85rem;
        font-weight: 500;
        margin-bottom: 1.5rem;
        border: 1px solid rgba(56, 189, 248, 0.2);
      }

      /* Loading Bar */
      .loader-container {
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        overflow: hidden;
        margin: 0 auto;
        max-width: 180px;
      }

      .loader-bar {
        height: 100%;
        width: 0%;
        background: var(--accent-color);
        border-radius: 10px;
        box-shadow: 0 0 10px var(--accent-color); /* Neon glow efekti */
        transition: width 1.5s ease-in-out;
      }

      /* Footer Links */
      .socials {
        margin-top: 3rem;
        display: flex;
        justify-content: center;
        gap: 25px;
      }

      .social-link {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.9rem;
        transition: all 0.3s ease;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      .social-link:hover {
        color: var(--text-main);
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
      }

      @keyframes float {
        0% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(30px, 20px);
        }
        100% {
          transform: translate(0, 0);
        }
      }

      /* Mobile Adjustments */
      @media (max-width: 600px) {
        h1 {
          font-size: 2rem;
        }
        .container {
          padding: 3rem 1.5rem;
        }
        .blob {
          filter: blur(60px);
        } /* Mobilde performansı artırır */
      }
    </style>
  </head>
  <body>
    <!-- Background Glows -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Main Content -->
    <div class="container" id="mainCard">
      <span class="badge">Frontend Developer</span>

      <h1>Code in<br />motion.</h1>

      <p class="subtitle">Building a new digital experience.</p>

      <div class="loader-container">
        <div class="loader-bar" id="loader"></div>
      </div>

      <div class="socials">
        <!-- <a href="#" class="social-link">GITHUB</a> -->
        <a
          href="https://www.linkedin.com/in/farhadsultan"
          target="_blank"
          class="social-link"
          >LINKEDIN</a
        >
        <a
          href="https://www.instagram.com/ferhad.sultann"
          target="_blank"
          class="social-link"
          >INSTAGRAM</a
        >
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const card = document.getElementById("mainCard");
        const loader = document.getElementById("loader");

        // Reveal Card
        setTimeout(() => {
          card.classList.add("visible");
        }, 100);

        // Animate Loader
        setTimeout(() => {
          loader.style.width = "75%";
        }, 600);
      });
    </script>
  </body>
</html>
